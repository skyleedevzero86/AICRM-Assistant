spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/aicrm
    username: aicrm
    password: aicrm
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  data:
    redis:
      host: localhost
      port: 9379
      password: 123456
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info
