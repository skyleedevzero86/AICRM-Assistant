server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: core-api-service
  profiles:
    active: local
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.chat.client.ChatClientAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true

security:
  jwt:
    secret: AICRM-DEMO-SECRET-KEY-CHANGE-ME-AT-LEAST-32-CHARS
    expiration-seconds: 3600

aicrm:
  attachment:
    max-file-size-bytes: 10485760
    allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,txt,zip
