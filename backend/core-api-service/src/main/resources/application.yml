server:
  port: 8080

spring:
  application:
    name: core-api-service
  profiles:
    active: local
  config:
    import: optional:classpath:application-local.yml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    db:
      enabled: true
