[project]
name = "aicrm-ai-worker"
version = "0.1.0"
description = "FastAPI worker for document parsing, RAG indexing, and GraphRAG experiments."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "python-multipart>=0.0.17",
    "unstructured[pdf]>=0.16.5",
    "neo4j>=5.26.0",
    "neo4j-graphrag>=1.3.0",
    "langchain>=0.3.7",
    "langgraph>=0.2.45",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "redis>=5.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "ruff>=0.7.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
