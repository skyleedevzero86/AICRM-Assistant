services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicrm-postgres
    environment:
      POSTGRES_DB: aicrm
      POSTGRES_USER: aicrm
      POSTGRES_PASSWORD: aicrm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: aicrm-redis
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5.26-community
    container_name: aicrm-neo4j
    environment:
      NEO4J_AUTH: neo4j/aicrm-password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: aicrm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aicrm
      MINIO_ROOT_PASSWORD: aicrm-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  neo4j-data:
  minio-data:
